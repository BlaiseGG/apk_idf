name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publier l'APK dans les Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Index des gares (données ouvertes IDFM)
        run: |
          mkdir -p app/src/main/assets
          python3 tools/build_station_index.py app/src/main/assets/stations.json || echo "::warning::Index des gares non généré, l'app utilisera PRIM"
          ls -la app/src/main/assets || true

      - name: Compiler l'APK
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: |
          if [ -n "$PRIM_API_KEY" ]; then echo "Clé API PRIM intégrée : oui"; else echo "Clé API PRIM intégrée : NON (secret absent)"; fi
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests '*StationIndexTest*' assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Quai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quai
          path: Quai.apk

      # Lien direct toujours à jour : https://github.com/<owner>/<repo>/releases/latest/download/Quai.apk
      - name: Publier dans les Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quai (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Quai.apk
          body: |
            Téléchargez **Quai.apk** ci-dessous et ouvrez-le sur le téléphone.
            Commit : ${{ github.sha }}
