name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WifiMaison.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WifiMaison
          path: WifiMaison.apk

      - name: Publish to the "apk-latest" release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Wi-Fi Maison (dernière version)
          prerelease: true
          files: WifiMaison.apk
